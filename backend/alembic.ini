# Alembic configuration for the LearnFlow backend.
#
# Run from backend/:
#
#   python -m alembic upgrade head          apply every pending migration
#   python -m alembic downgrade -1          revert the most recent migration
#   python -m alembic current               show the applied revision
#   python -m alembic upgrade head --sql    print SQL without connecting
#
# Creating a revision uses the dated identifier required by
# docs/database/migrations.md:
#
#   python -m alembic revision --autogenerate \
#       --rev-id 20260731_02 -m "add learner tables"
#
# Autogenerated output is a starting point for review, never proof that a
# migration is correct.

[alembic]
script_location = migrations

# Makes the `app` package importable so migrations/env.py can read the
# application's validated settings and model metadata.
prepend_sys_path = .
path_separator = os

# The revision id already carries the date, so the filename needs no second one.
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is deliberately absent. migrations/env.py reads DATABASE_URL
# through the same validated Settings the application uses, so a migration
# cannot be applied to a database the application was never configured for, and
# no credentials live in a committed file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

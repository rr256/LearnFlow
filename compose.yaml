# LearnFlow local development services.
#
# Currently defines the frontend, backend, and postgres services. The approved
# target topology in docs/deployment/docker.md also includes chromadb; it joins
# this file in the change that implements the code consuming it, so no service
# here is unused or unconfigurable.
#
# Ollama runs on the host, not as a service here: it is a developer's own
# install, often with models already pulled, and containerising it would either
# duplicate several gigabytes or mount a host directory into a service this file
# does not own. The backend reaches it through the host gateway; see the
# `backend` service below.
#
#   docker compose up --build        start, building images as needed
#   docker compose up -d postgres    database only, for host-side Alembic/tests
#   docker compose logs -f backend   follow backend logs
#   docker compose down              stop, preserving any named volumes
#
# `docker compose down -v` deletes named volumes and is destructive. It is not a
# routine stop command.

name: learnflow

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      # Fixed, not interpolated, for the same reason as the backend's
      # DATABASE_URL: a developer's .env names the backend's published loopback
      # port, which inside this container is the container itself. The port
      # still follows API_PORT so the two services cannot drift apart.
      #
      # This is read on the Next.js server only. The curriculum views render as
      # server components, so no API address reaches a browser.
      API_BASE_URL: http://backend:${API_PORT:-8000}
    # Published on the loopback interface only, so the application is not
    # exposed to other devices on the local network.
    ports:
      - "127.0.0.1:3000:3000"
    # `fetch` is global in Node 24, so the image needs no health-probe package.
    #
    # /health is a static route that reaches nothing, so this probe asks only
    # whether the frontend process is responding. Probing `/` instead would call
    # the API up to three times every interval, to render a page nobody reads.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          fetch("http://127.0.0.1:3000/health")
            .then((response) => process.exit(response.ok ? 0 : 1))
            .catch(() => process.exit(1));
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    # The frontend renders per request and needs no API at startup, so this is
    # convenience rather than necessity: waiting means the first page a learner
    # opens meets a backend ready to answer.
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      # Values interpolate from the shell or a local .env file, with the
      # documented defaults applied when unset. docs/deployment/environments.md
      # is the authoritative catalogue.
      APP_ENV: ${APP_ENV:-local}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      # Fixed, not interpolated: `python -m app.main` binds this address, and a
      # container must listen on 0.0.0.0 to accept connections from the host. A
      # developer's local API_HOST=127.0.0.1 must not reach the container.
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
      # Composed here rather than interpolated from DATABASE_URL, for the same
      # reason as API_HOST: a developer's .env points at 127.0.0.1 for host-side
      # Alembic runs, which inside this container is the container itself. The
      # credentials and database name still come from the POSTGRES_* values, so
      # the two services cannot drift apart.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-learnflow}:${POSTGRES_PASSWORD:-learnflow}@postgres:5432/${POSTGRES_DB:-learnflow}
      # The AI provider (MNT-001). Ollama runs on the host, so the address is
      # fixed to the host gateway rather than interpolated from a developer's
      # OLLAMA_BASE_URL — that value names 127.0.0.1, which inside this
      # container is the container itself. Same reasoning as DATABASE_URL and
      # the frontend's API_BASE_URL above.
      #
      # OLLAMA_CONTAINER_BASE_URL overrides it for an Ollama that is not on the
      # host gateway's default port, or is on another machine entirely. It is a
      # Compose-only variable: nothing in the backend reads it.
      #
      # The model name is not host-dependent, so it interpolates normally and a
      # developer's .env reaches the container unchanged.
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-60}
      OLLAMA_BASE_URL: ${OLLAMA_CONTAINER_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
    # `host.docker.internal` is provided natively by Docker Desktop on macOS and
    # Windows. Docker Engine on Linux does not provide it, so it is mapped here
    # to the special `host-gateway` value and the same address works on all
    # three. Declaring it on Docker Desktop is harmless: the name already
    # resolves, and this maps it to the same gateway.
    #
    # This is the only route out of the backend container. It reaches the host
    # that started it and nothing beyond, so a learner's passages stay on their
    # own machine exactly as they do in a host-side run.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Published on the loopback interface only, so the API is not exposed to
    # other devices on the local network.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:${API_PORT:-8000}"
    # GET /health is the operational endpoint served outside /api/v1. urllib is
    # standard library, so the image needs no extra health-probe package.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          with urllib.request.urlopen(
              "http://127.0.0.1:${API_PORT:-8000}/health", timeout=2
          ) as response:
              raise SystemExit(0 if response.status == 200 else 1)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    # The backend does not create schema at startup, so a reachable database is
    # not required for the process to boot. Waiting for health anyway means the
    # first request meets a database ready to accept connections.
    #
    # Migrations are not run from this container: the image contains
    # backend/app only, not alembic.ini or migrations/. Apply them from the host
    # against the published port; see docs/database/migrations.md.
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    # PostgreSQL 15 or later is required: the topics uniqueness constraint uses
    # NULLS NOT DISTINCT. Pinned to a major version so a rebuild cannot move the
    # local database to a new major without an explicit change here.
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learnflow}
      POSTGRES_USER: ${POSTGRES_USER:-learnflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnflow}
    volumes:
      # Mounted at /var/lib/postgresql, not /var/lib/postgresql/data. The
      # postgres:18+ images store data in a major-version-specific subdirectory
      # under this single mount, so that `pg_upgrade --link` can later move
      # between majors without crossing a mount-point boundary. An image of 18
      # or later refuses to start when it finds a volume at the older
      # /var/lib/postgresql/data path — see docker-library/postgres#1259.
      - postgres_data:/var/lib/postgresql
    # Published on loopback only, so the database is not reachable from other
    # devices on the local network. It is published at all so a contributor can
    # run Alembic and the integration tests from the host.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-learnflow} -d ${POSTGRES_DB:-learnflow}
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  # Learner data lives here. `docker compose down -v` deletes it; `docker
  # compose down` does not.
  postgres_data:

# LearnFlow pull request verification.
#
# Runs the deterministic checks documented in docs/deployment/ci-cd.md:
# backend tests, Ruff lint and format, documentation validation, database
# migration checks, frontend lint/type/test/build, and container build
# validation.
#
# The security-scanning job is deliberately absent until the artifact it checks
# exists. Do not add a check here that is not deterministic, documented, and
# runnable locally by the same command.

name: pull-request

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest

  documentation:
    name: Documentation validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # PyYAML and Ruff are pinned in backend/requirements-dev.txt so the
      # validator has a single dependency source shared with the backend job.
      - name: Install development dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      # scripts/ sits outside backend/, so Ruff is pointed at the project
      # configuration explicitly rather than relying on config discovery.
      - name: Lint scripts
        run: python -m ruff check --config backend/pyproject.toml scripts/

      - name: Check script formatting
        run: python -m ruff format --check --config backend/pyproject.toml scripts/

      - name: Validate documentation front matter and links
        run: python scripts/validate_docs.py

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # LearnFlow is local-first (NFR-001); no CI run reports build data outward.
    env:
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` installs exactly the committed lockfile and fails if
      # package.json and the lockfile disagree, which `npm install` would
      # silently reconcile.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # The production build is a check in its own right: it fails on a type
      # error Next.js reports that `tsc` alone does not, and on a route that
      # cannot render. Every curriculum route is dynamic, so it reaches no API.
      - name: Build
        run: npm run build

  database:
    name: Database migration checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Ephemeral and per-run, so migrations are always applied from an empty
    # database and no developer's local data is ever involved.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: learnflow_test
          POSTGRES_USER: learnflow
          POSTGRES_PASSWORD: learnflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U learnflow -d learnflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://learnflow:learnflow@127.0.0.1:5432/learnflow_test

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      # The integration tests skip themselves when TEST_DATABASE_URL names
      # nothing reachable. Without this step that skip would leave the job
      # green while verifying nothing at all.
      - name: Verify the test database is reachable
        run: python -c "import os, sqlalchemy; sqlalchemy.create_engine(os.environ['TEST_DATABASE_URL']).connect().close(); print('test database reachable')"

      # Applies every migration to an empty database, checks the models against
      # the resulting schema, exercises the documented constraints, and runs the
      # downgrade back to empty. Also applies each seed twice, which is where its
      # idempotency is verified against real rows, and serves the curriculum
      # endpoints from the seeded database over HTTP.
      - name: Run migration, schema, seed, and API tests
        run: python -m pytest tests/integration

  containers:
    name: Container build validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      # Validates service definitions and variable interpolation without
      # starting anything. Compose defaults apply, so no .env file is needed.
      - name: Validate Compose topology
        run: docker compose config -q

      # Catches dependency and build failures. No image is pushed to any
      # registry; publication requires an approved deployment strategy first.
      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile .

      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile .

# LearnFlow pull request verification.
#
# Runs the deterministic checks documented in docs/deployment/ci-cd.md:
# backend tests, Ruff lint and format, and documentation validation.
#
# Frontend, database, container, and security-scanning jobs are deliberately
# absent until the artifacts they check exist. Do not add a check here that is
# not deterministic, documented, and runnable locally by the same command.

name: pull-request

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest

  documentation:
    name: Documentation validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # PyYAML and Ruff are pinned in backend/requirements-dev.txt so the
      # validator has a single dependency source shared with the backend job.
      - name: Install development dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      # scripts/ sits outside backend/, so Ruff is pointed at the project
      # configuration explicitly rather than relying on config discovery.
      - name: Lint scripts
        run: python -m ruff check --config backend/pyproject.toml scripts/

      - name: Check script formatting
        run: python -m ruff format --check --config backend/pyproject.toml scripts/

      - name: Validate documentation front matter and links
        run: python scripts/validate_docs.py
